      :root {
        color-scheme: dark;
        --bg: #1b1719;
        --fg: #d9d9d9;
        --muted: rgba(217, 217, 217, 0.6);
        --border: rgba(217, 217, 217, 0.15);
        --accent: #f5a623;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);

      }
      main {
        max-width: 30rem;
      }
      img {
        width: 96px;
        height: 96px;
        margin-bottom: 1.5rem;
        opacity: 0.9;
      }
      .code {
        font-size: 4.5rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        line-height: 1;
        color: var(--accent);
      }
      h1 {
        font-size: 1.25rem;
        margin-top: 0.75rem;
      }
      p {
        margin-top: 0.75rem;
        color: var(--muted);
        font-size: 0.95rem;
      }

        display: inline-block;
        margin-top: 1.75rem;
        padding: 0.625rem 1.25rem;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        color: var(--fg);
        font-weight: 700;
